<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Task Voice</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #16161a;
    --text: #f2f2f2;
    --muted: #8a8a93;
    --accent: #4f8cff;
    --recording: #ff4f4f;
    --paused: #ffb84f;
    --error: #ff4f4f;
    --success: #3ddc84;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px 24px 80px;
    text-align: center;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin: 0 0 48px;
    text-transform: uppercase;
  }

  #recordBtn {
    width: min(60vw, 240px);
    height: min(60vw, 240px);
    border-radius: 50%;
    border: none;
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    cursor: pointer;
    box-shadow: 0 0 0 6px rgba(255,255,255,0.04);
    transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
    touch-action: manipulation;
  }

  #recordBtn:active { transform: scale(0.97); }

  #recordBtn.recording {
    background: var(--recording);
    box-shadow: 0 0 0 14px rgba(255,79,79,0.15);
    animation: pulse 1.4s ease-in-out infinite;
  }

  #recordBtn.paused {
    background: var(--paused);
    box-shadow: 0 0 0 14px rgba(255,184,79,0.15);
    animation: none;
  }

  #recordBtn.disabled { opacity: 0.4; cursor: not-allowed; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 14px rgba(255,79,79,0.15); }
    50% { box-shadow: 0 0 0 22px rgba(255,79,79,0.08); }
  }

  #secondaryControls { display: none; gap: 16px; margin-top: 24px; }
  #secondaryControls.visible { display: flex; }

  #secondaryControls button {
    background: var(--surface);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  #deleteBtn { border-color: rgba(255,79,79,0.4) !important; color: var(--error); }

  #status { margin-top: 36px; font-size: 16px; font-weight: 500; min-height: 24px; }
  #status.ready { color: var(--muted); }
  #status.recording { color: var(--recording); }
  #status.paused { color: var(--paused); }
  #status.sending { color: var(--accent); }
  #status.done { color: var(--success); }
  #status.error { color: var(--error); }
  #status.offline { color: var(--error); }

  #retryBtn {
    margin-top: 16px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--error);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    display: none;
  }
  #retryBtn.visible { display: inline-block; }

  #lastSubmit {
    position: fixed;
    bottom: 56px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    opacity: 0.7;
  }

  #unsupported {
    display: none;
    max-width: 320px;
    color: var(--error);
    font-size: 14px;
    line-height: 1.5;
    margin-top: 24px;
  }

  #dashboardLink {
    position: fixed;
    top: 16px; right: 16px;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    opacity: 0.85;
  }

  #orDivider {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 28px 0 16px;
  }

  #textInputSection { width: min(90vw, 360px); }

  #taskTextInput {
    width: 100%;
    min-height: 84px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }
  #taskTextInput:disabled { opacity: 0.4; cursor: not-allowed; }

  #sendTextBtn {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendTextBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* LOGIN SCREEN */
  #loginScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
    z-index: 100;
  }

  #loginScreen h1 { margin-bottom: 12px; }

  #loginScreen p {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 44px;
    line-height: 1.6;
  }

  #googleBtnContainer {
    display: flex;
    justify-content: center;
    min-height: 44px;
  }

  #loginError {
    margin-top: 20px;
    color: var(--error);
    font-size: 13px;
    min-height: 20px;
    max-width: 280px;
    line-height: 1.5;
  }

  /* USER BAR */
  #userBar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--surface);
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  #userNameDisplay {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }

  #signOutBtn {
    flex-shrink: 0;
    background: transparent;
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  #signOutBtn:active { opacity: 0.7; }
</style>
</head>
<body>

  <!-- Login screen -->
  <div id="loginScreen">
    <h1>Task Voice</h1>
    <p>Sign in with your Acme Construction<br>company account to continue.</p>
    <div id="googleBtnContainer"></div>
    <div id="loginError"></div>
  </div>

  <!-- User bar -->
  <div id="userBar">
    <span id="userNameDisplay"></span>
    <button id="signOutBtn" type="button">Sign Out</button>
  </div>

  <a id="dashboardLink" href="https://acmeok-construction-dashboard.vercel.app/" target="_blank" rel="noopener">Dashboard &rarr;</a>

  <h1>Task Voice</h1>

  <button id="recordBtn" type="button">Tap to Record</button>

  <div id="secondaryControls">
    <button id="pauseBtn" type="button">⏸ Pause</button>
    <button id="deleteBtn" type="button">🗑 Restart</button>
  </div>

  <div id="orDivider">or type a task instead</div>

  <div id="textInputSection">
    <textarea id="taskTextInput" placeholder="e.g. Tell Sarah to order more plates by Tuesday"></textarea>
    <button id="sendTextBtn" type="button" disabled>Send</button>
  </div>

  <div id="status" class="ready">Ready</div>
  <button id="retryBtn" type="button">Retry</button>

  <div id="unsupported"></div>
  <div id="lastSubmit"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithCredential, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

// =========================================================
const N8N_WEBHOOK_URL = "https://acmeconstruction.app.n8n.cloud/webhook/80acff81-4ad5-478b-8323-095bc9029d86";
const SECRET_TOKEN = "DavidVoiceMessageApp";
const firebaseConfig = {
  apiKey: "AIzaSyBRB8OhCL80e0o0hglwtoQdYwPsGSaoCLc",
  authDomain: "acmeok-dashboard.firebaseapp.com",
  projectId: "acmeok-dashboard",
  storageBucket: "acmeok-dashboard.firebasestorage.app",
  messagingSenderId: "557242620616",
  appId: "1:557242620616:web:7afbc35e9c83fdce3123fd"
};
// =========================================================

const GIS_CLIENT_ID = '557242620616-bl2r4clf6b3dj1jf9ai5utork7ddprvd.apps.googleusercontent.com';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginScreen     = document.getElementById('loginScreen');
const loginError      = document.getElementById('loginError');
const userBar         = document.getElementById('userBar');
const userNameDisplay = document.getElementById('userNameDisplay');
const signOutBtn      = document.getElementById('signOutBtn');
const recordBtn       = document.getElementById('recordBtn');
const secondaryControls = document.getElementById('secondaryControls');
const pauseBtn        = document.getElementById('pauseBtn');
const deleteBtn       = document.getElementById('deleteBtn');
const statusEl        = document.getElementById('status');
const retryBtn        = document.getElementById('retryBtn');
const lastSubmitEl    = document.getElementById('lastSubmit');
const unsupportedEl   = document.getElementById('unsupported');
const taskTextInput   = document.getElementById('taskTextInput');
const sendTextBtn     = document.getElementById('sendTextBtn');

let currentSender = null;
let mediaRecorder = null;
let audioChunks = [];
let mimeType = '';
let lastBlob = null;
let stream = null;
let pendingDiscard = false;
let recordingState = 'idle';
let recordingSupported = true;

const LAST_SUBMIT_KEY = 'taskvoice_last_submit';

// ---- AUTH ----

// onAuthStateChanged is the single source of truth.
// It fires automatically after signInWithRedirect completes.
onAuthStateChanged(auth, (user) => {
  if (user) {
    if (!user.email.endsWith('@acmeok.com')) {
      signOut(auth);
      loginError.textContent = 'Only @acmeok.com company accounts are allowed.';
      return;
    }
    currentSender = { name: user.displayName || user.email, email: user.email };
    loginScreen.style.display = 'none';
    userBar.style.display = 'flex';
    userNameDisplay.textContent = user.displayName || user.email;
    checkSupport();
    loadLastSubmit();
    updateInputModeAvailability();
    if (!navigator.onLine) setStatus('You are offline', 'offline');
  } else {
    currentSender = null;
    loginScreen.style.display = 'flex';
    userBar.style.display = 'none';
  }
});

// Load Google Identity Services and render the sign-in button.
// GIS shows a native account chooser that works on mobile and desktop
// without popups or redirects to an external auth handler page.
(function loadGis() {
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = function() {
    google.accounts.id.initialize({
      client_id: GIS_CLIENT_ID,
      callback: function(response) {
        loginError.textContent = '';
        const credential = GoogleAuthProvider.credential(response.credential);
        signInWithCredential(auth, credential).catch(function(err) {
          loginError.textContent = 'Sign-in failed (' + err.code + '). Please try again.';
        });
      },
      hd: 'acmeok.com',
      auto_select: false,
      cancel_on_tap_outside: false
    });
    google.accounts.id.renderButton(
      document.getElementById('googleBtnContainer'),
      { theme: 'outline', size: 'large', text: 'signin_with', width: 280 }
    );
    google.accounts.id.prompt();
  };
  document.head.appendChild(s);
})();

signOutBtn.addEventListener('click', () => signOut(auth));

// ---- RECORDING ----

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls;
}

function pickMimeType() {
  const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/ogg;codecs=opus'];
  for (const type of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) return type;
  }
  return '';
}

function checkSupport() {
  const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const hasMediaRecorder = !!window.MediaRecorder;
  if (!hasMediaDevices || !hasMediaRecorder) {
    recordingSupported = false;
    recordBtn.classList.add('disabled');
    recordBtn.disabled = true;
    setStatus('Error', 'error');
    unsupportedEl.style.display = 'block';
    unsupportedEl.textContent = 'Your browser does not support audio recording. Please use Chrome on Android.';
    return false;
  }
  return true;
}

function loadLastSubmit() {
  const stored = localStorage.getItem(LAST_SUBMIT_KEY);
  if (stored) lastSubmitEl.textContent = 'Last submission: ' + stored;
}

function saveLastSubmit() {
  const formatted = new Date().toLocaleString();
  localStorage.setItem(LAST_SUBMIT_KEY, formatted);
  lastSubmitEl.textContent = 'Last submission: ' + formatted;
}

function updateControlsForState() {
  recordBtn.classList.remove('recording', 'paused');
  if (recordingState === 'idle') {
    recordBtn.textContent = 'Tap to Record';
    secondaryControls.classList.remove('visible');
    pauseBtn.textContent = '⏸ Pause';
  } else if (recordingState === 'recording') {
    recordBtn.textContent = 'Tap to Stop & Send';
    recordBtn.classList.add('recording');
    secondaryControls.classList.add('visible');
    pauseBtn.textContent = '⏸ Pause';
    setStatus('Recording', 'recording');
  } else if (recordingState === 'paused') {
    recordBtn.textContent = 'Tap to Stop & Send';
    recordBtn.classList.add('paused');
    secondaryControls.classList.add('visible');
    pauseBtn.textContent = '▶ Resume';
    setStatus('Paused', 'paused');
  }
  updateInputModeAvailability();
}

function updateInputModeAvailability() {
  const isRecording = recordingState !== 'idle';
  taskTextInput.disabled = isRecording;
  sendTextBtn.disabled = isRecording || taskTextInput.value.trim() === '';
  const hasTypedText = taskTextInput.value.trim() !== '';
  if (!isRecording && recordingSupported) {
    recordBtn.classList.toggle('disabled', hasTypedText);
    recordBtn.disabled = hasTypedText;
  }
}

async function startRecording() {
  if (recordingState !== 'idle') return;
  if (!navigator.onLine) { setStatus('You are offline', 'offline'); return; }
  retryBtn.classList.remove('visible');
  audioChunks = [];
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    setStatus('Error', 'error');
    unsupportedEl.style.display = 'block';
    unsupportedEl.textContent = 'Microphone access was denied. Please allow microphone permission and try again.';
    return;
  }
  mimeType = pickMimeType();
  try {
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
  } catch (err) {
    mediaRecorder = new MediaRecorder(stream);
    mimeType = mediaRecorder.mimeType || '';
  }
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    recordingState = 'idle';
    updateControlsForState();
    if (pendingDiscard) { pendingDiscard = false; startRecording(); return; }
    const blob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
    lastBlob = blob;
    sendRecording(blob);
  };
  mediaRecorder.start();
  recordingState = 'recording';
  updateControlsForState();
}

function stopAndSend() {
  if (recordingState === 'idle' || !mediaRecorder) return;
  pendingDiscard = false;
  if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

function togglePause() {
  if (!mediaRecorder) return;
  if (recordingState === 'recording' && mediaRecorder.state === 'recording') {
    mediaRecorder.pause(); recordingState = 'paused'; updateControlsForState();
  } else if (recordingState === 'paused' && mediaRecorder.state === 'paused') {
    mediaRecorder.resume(); recordingState = 'recording'; updateControlsForState();
  }
}

function discardAndRestart() {
  if (recordingState === 'idle' || !mediaRecorder) return;
  pendingDiscard = true;
  audioChunks = [];
  if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

async function sendRecording(blob) {
  if (!navigator.onLine) { setStatus('You are offline', 'offline'); retryBtn.classList.add('visible'); return; }
  setStatus('Sending', 'sending');
  retryBtn.classList.remove('visible');
  const extension = (mimeType && mimeType.includes('mp4')) ? 'mp4' : 'webm';
  const formData = new FormData();
  formData.append('audio', blob, `recording-${Date.now()}.${extension}`);
  if (currentSender) {
    formData.append('sender_name', currentSender.name);
    formData.append('sender_email', currentSender.email);
  }
  try {
    const response = await fetch(N8N_WEBHOOK_URL, { method: 'POST', headers: { 'X-Secret-Token': SECRET_TOKEN }, body: formData });
    if (!response.ok) throw new Error('status ' + response.status);
    setStatus('Done', 'done');
    saveLastSubmit();
  } catch (err) {
    setStatus('Error', 'error');
    retryBtn.classList.add('visible');
  }
}

async function sendTypedTask() {
  const text = taskTextInput.value.trim();
  if (!text) return;
  if (!navigator.onLine) { setStatus('You are offline', 'offline'); return; }
  setStatus('Sending', 'sending');
  retryBtn.classList.remove('visible');
  sendTextBtn.disabled = true;
  taskTextInput.disabled = true;
  const formData = new FormData();
  formData.append('task_text', text);
  formData.append('sender_name', currentSender.name);
  formData.append('sender_email', currentSender.email);
  try {
    const response = await fetch(N8N_WEBHOOK_URL, { method: 'POST', headers: { 'X-Secret-Token': SECRET_TOKEN }, body: formData });
    if (!response.ok) throw new Error('status ' + response.status);
    setStatus('Done', 'done');
    saveLastSubmit();
    taskTextInput.value = '';
  } catch (err) {
    setStatus('Error', 'error');
  } finally {
    updateInputModeAvailability();
  }
}

retryBtn.addEventListener('click', () => { if (lastBlob) sendRecording(lastBlob); });
taskTextInput.addEventListener('input', updateInputModeAvailability);
sendTextBtn.addEventListener('click', sendTypedTask);
recordBtn.addEventListener('click', () => {
  if (recordBtn.disabled) return;
  if (recordingState === 'idle') startRecording(); else stopAndSend();
});
pauseBtn.addEventListener('click', togglePause);
deleteBtn.addEventListener('click', discardAndRestart);

window.addEventListener('offline', () => { if (recordingState === 'idle') setStatus('You are offline', 'offline'); });
window.addEventListener('online', () => { if (statusEl.classList.contains('offline')) setStatus('Ready', 'ready'); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist();
}
</script>
</body>
</html>
